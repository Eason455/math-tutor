function startQuiz(){round=shuffled(bank).slice(0,12);answers=Array(round.length).fill(null);position=0;renderQuestion()}
function renderQuestion(){
document.title=tr("pageTitle");

app.innerHTML="<section class=\"panel quiz-panel\"><div class=\"quiz-meta\"><span>"+tr("question")+" "+(position+1)+" "+tr("of")+" "+round.length+"</span><span>"+progress+"%</span></div><div class=\"progress\" role=\"progressbar\" aria-label=\""+tr("question")+" "+(position+1)+" "+tr("of")+" "+round.length+"\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\""+progress+"\"><div class=\"progress-fill\" style=\"width:"+progress+"%\"></div></div><h2 class=\"question\">"+escapeHtml(q[lang==="zh-CN"?1:2])+"</h2><div class=\"options\" role=\"group\" aria-label=\""+tr("answerHint")+"\">"+options+"</div><div class=\"quiz-actions\"><button class=\"back\" id=\"back\" type=\"button\">"+(position===0?tr("exit"):tr("previous"))+"</button><button class=\"cta\" id=\"next\" type=\"button\" "+(answers[position]===null?"disabled":"")+">"+(position===round.length-1?tr("finish"):tr("next"))+"<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4 12h15m-6-6 6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button></div><p class=\"quiz-foot\">"+tr("answerHint")+"</p></section>";

function renderResult(){
